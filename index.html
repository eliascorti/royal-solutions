<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Royal Solutions</title>
  <meta name="description" content="Royal Solutions — app cliente y app prestador para contratar y ofrecer servicios.">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <script>document.documentElement.dataset.theme = "light";</script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { min-height: 100vh; }

    .demo { display: none; min-height: 100vh; padding: 16px; flex-direction: column; gap: 12px; background: var(--surface-3); }
    body.demo-on .wrap { display: none; }
    body.demo-on .demo { display: flex; }
    .phones { display: flex; gap: 56px; justify-content: center; align-items: flex-start; flex: 1; }
    .phone { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .phone .lbl { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
    /* Teléfono de tamaño real (pantalla 390×844, como un iPhone 14). El JS escala el .slot entero. */
    .slot { position: relative; }
    .handset {
      position: absolute; top: 0; left: 0; width: 416px; height: 870px; transform-origin: top left;
      background: #1B1A19; border-radius: 62px; padding: 13px;
      box-shadow: inset 0 0 0 2px #3B3834, 0 0 0 1px #0E0D0C, 0 30px 60px -20px rgba(20, 16, 12, .35);
    }
    .handset::before, .handset::after { content: ""; position: absolute; background: #2A2826; border-radius: 2px; }
    .handset::before { left: -3px; top: 170px; width: 3px; height: 64px; box-shadow: 0 84px 0 #2A2826; } /* volumen */
    .handset::after { right: -3px; top: 220px; width: 3px; height: 96px; } /* encendido */
    .glass { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: var(--bg); }
    .glass iframe { position: absolute; left: 0; top: 47px; width: 390px; height: 797px; border: 0; display: block; }
    .status { position: absolute; inset: 0 0 auto 0; height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font: 600 15px/1 -apple-system, 'SF Pro Text', var(--font-sans); letter-spacing: -.01em; z-index: 2; }
    .status .icons { display: flex; gap: 6px; align-items: center; }
    .status svg { display: block; fill: currentColor; }
    .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; background: #000; border-radius: 20px; z-index: 3; }
    .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; z-index: 3; pointer-events: none; opacity: .85; }
    .glass.light .status { background: #F6F4F1; color: #1F1B17; } .glass.light .homebar { background: #1F1B17; }
    .glass.dark .status { background: #141210; color: #F1ECE6; } .glass.dark .homebar { background: #F1ECE6; }
    @media (max-width: 900px) {
      .phones { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body class="demo-on">
  <section class="demo" aria-label="Aplicaciones Royal Solutions">
    <div class="phones" id="phones">
      <div class="phone"><a class="lbl" href="cliente.html" aria-label="Abrir app cliente">App cliente ↗</a><div class="slot"><div class="handset"><div class="glass light"><div class="status"><span class="clock">9:41</span><span class="icons"></span></div><div class="island"></div><iframe title="App cliente" data-src="cliente.html" data-app="cliente"></iframe><div class="homebar"></div></div></div></div></div>
      <div class="phone"><a class="lbl" href="prestador.html" aria-label="Abrir app prestador">App prestador ↗</a><div class="slot"><div class="handset"><div class="glass light"><div class="status"><span class="clock">9:41</span><span class="icons"></span></div><div class="island"></div><iframe title="App prestador" data-src="prestador.html" data-app="prestador"></iframe><div class="homebar"></div></div></div></div></div>
    </div>
  </section>

  <script type="module">
    import * as S from "./js/store.js";
    S.load();
    if (!localStorage.getItem("rs_apps_initialized")) {
      for (const [app, email] of [["cliente", "lucia@demo.com"], ["prestador", "ramiro@demo.com"]]) {
        const user = S.getDb().users.find(u => u.email === email);
        if (!S.getSession(app) && user) S.setSession(app, user.id);
        localStorage.setItem(`rs_onboarding_done_${app}`, "1");
      }
      localStorage.setItem("rs_apps_initialized", "1");
    }
    const frames = [...document.querySelectorAll('.demo iframe')];
    const W = 416, H = 870; // teléfono con carcasa
    const ICONS = '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>'
      + '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 10.4 9a3.4 3.4 0 0 0-4.8 0zM3.4 6.8l1.5 1.5a4.4 4.4 0 0 1 6.2 0l1.5-1.5a6.5 6.5 0 0 0-9.2 0zM1 4.4l1.5 1.5a7.8 7.8 0 0 1 11 0L15 4.4a9.9 9.9 0 0 0-14 0z"/></svg>'
      + '<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" opacity=".4"/></svg>';
    document.querySelectorAll('.status .icons').forEach((el) => { el.innerHTML = ICONS; });

    function fit() {
      // Escala los teléfonos enteros (sin recortar) para que entren en la pantalla.
      const narrow = window.innerWidth < 900;
      const availH = window.innerHeight - 110;
      const availW = narrow ? window.innerWidth - 32 : (window.innerWidth - 56 - 48) / 2;
      const k = Math.max(0.4, Math.min(1.15, availH / H, availW / W));
      document.querySelectorAll('.slot').forEach((slot) => {
        slot.style.width = W * k + 'px';
        slot.style.height = H * k + 'px';
        slot.firstElementChild.style.transform = `scale(${k})`;
      });
    }
    function tickClock() {
      const d = new Date();
      const t = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      document.querySelectorAll('.clock').forEach((c) => { c.textContent = t; });
      // la barra de estado copia el tema de cada app
      frames.forEach((f) => {
        try { const th = f.contentDocument?.documentElement.dataset.theme; if (th) f.parentElement.className = 'glass ' + th; } catch (e) { /* */ }
      });
    }
    function openDemo() {
      document.body.classList.add('demo-on');
      frames.forEach((f) => { if (!f.src) f.src = f.dataset.src; });
      fit();

    }
    window.addEventListener('resize', fit);
    setInterval(tickClock, 1000); tickClock();
    openDemo();
  </script>
</body>
</html>
